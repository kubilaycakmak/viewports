name: Publish existing 4.0.1 to GitHub Packages
on:
  push:
    branches: [codex/publish-github-package-4-0-1]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish existing npm package 4.0.1 to GitHub Packages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kubilaycakmak'
      - name: Download published npmjs artifact
        run: npm pack @kubilaycakmak/viewports@4.0.1 --registry=https://registry.npmjs.org --ignore-scripts
      - name: Publish same artifact to GitHub Packages
        run: npm publish kubilaycakmak-viewports-4.0.1.tgz --registry=https://npm.pkg.github.com --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
