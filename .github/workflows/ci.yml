name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-tests:
    name: Installer / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:install
      - run: npm pack --dry-run

  desktop-tests:
    name: Desktop and MCP / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:mcp

  desktop-other-platforms:
    name: Desktop and MCP / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Allow unprivileged user namespaces for Chromium
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop and MCP tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a npm run test:desktop
          xvfb-run -a npm run test:mcp
      - name: Desktop and MCP tests (macOS)
        if: runner.os == 'macOS'
        run: |
          npm run test:desktop
          npm run test:mcp
