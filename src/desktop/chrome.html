<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewports</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .window-controls {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--controls-height);
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 7px;
      border-radius: 9px;
      background: rgba(31, 31, 34, .96);
      color: #eee;
      app-region: drag;
      -webkit-app-region: drag;
    }

    .window-controls button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      app-region: no-drag;
      -webkit-app-region: no-drag;
    }

    .window-controls button::before {
      display: block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff5f57;
      content: '';
    }

    .window-controls .minimize::before { background: #febc2e; }
    .window-controls button:focus-visible { outline: 2px solid white; border-radius: 4px; }
    .window-title { margin-left: 6px; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    body.desktop-window .window-controls, body.native-window-controls .window-controls { display: none; }

    .device {
      position: absolute;
      top: var(--controls-height);
      left: 0;
      width: calc(var(--width) * 1px);
      height: calc(var(--height) * 1px);
      transform: scale(var(--scale));
      transform-origin: top left;
      border-radius: var(--outer-radius);
      background: #09090b;
      box-shadow: inset 0 0 0 2px #49494f;
    }

    .screen {
      position: absolute;
      inset: 8px;
      overflow: hidden;
      border-radius: var(--screen-radius);
      background: #f4f4f6;
    }

    .status {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--status-height);
      padding: 5px 24px 0;
      color: #111;
      font-size: 13px;
      font-weight: 650;
    }

    .island {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 104px;
      height: 29px;
      transform: translateX(-50%);
      border-radius: 22px;
      background: #101010;
    }

    .indicators {
      font-size: 11px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .battery {
      position: relative;
      display: inline-block;
      width: 22px;
      height: 10px;
      margin-left: 3px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      vertical-align: -1px;
    }

    .battery:before {
      display: block;
      width: 15px;
      height: 5px;
      margin: 1px;
      border-radius: 1px;
      background: currentColor;
      content: '';
    }

    .battery:after {
      position: absolute;
      top: 2px;
      right: -4px;
      width: 2px;
      height: 4px;
      border-radius: 0 2px 2px 0;
      background: currentColor;
      content: '';
    }

    .bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: var(--bottom);
      padding: 7px 15px 0;
      background: #f4f4f6;
      color: #4b4c51;
    }

    .address {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 36px;
      overflow: hidden;
      border-radius: 11px;
      background: #e4e4e8;
      color: #25262a;
      font-size: 14px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .url {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-overflow: ellipsis;
    }

    .address {
      padding: 0 12px;
    }

    .address:focus-within {
      outline: 2px solid #7367f0;
    }

    .address.invalid {
      outline: 2px solid #c0392b;
    }

    .address button {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .desktop .screen {
      inset: 0;
      border-radius: 0;
    }

    .desktop .status, .desktop .bar {
      display: none;
    }

    .desktop .top-address {
      display: flex;
      height: 34px;
      margin: 7px 12px;
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 29px;
      padding: 0 12px;
      color: #555963;
      font-size: 18px;
    }

    .gesture {
      position: absolute;
      bottom: 6px;
      left: 50%;
      width: 120px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: #17171a;
    }

    .top-address {
      display: none;
      margin: 0 12px;
    }

    .android .status, .tablet .status, .ios-inner .status {
      height: 25px;
    }

    .android .top-address, .tablet .top-address, .ios-inner .top-address {
      display: flex;
    }

    .android .bar, .tablet .bar, .ios-inner .bar {
      padding: 0;
    }

    .android .bar .address, .android .tools,
    .tablet .bar .address, .tablet .tools,
    .ios-inner .bar .address, .ios-inner .tools {
      display: none;
    }

    .hide-top .status, .hide-top .top-address,
    .desktop.hide-top .top-address, .hide-bottom .bar {
      display: none;
    }

    .se .island, .android .island, .tablet .island, .ios-inner .island {
      display: none;
    }

    .se .status {
      padding-top: 0;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="window-controls" role="toolbar" aria-label="Window controls">
    <button type="button" class="close" aria-label="Close preview" title="Close preview"></button>
    <button type="button" class="minimize" aria-label="Minimize preview" title="Minimize preview"></button>
    <span class="window-title"></span>
  </div>
  <div class="device" id="device">
    <div class="screen">
      <div class="status">
        <span>9:41</span>
        <span class="island"></span>
        <span class="indicators">▰ ▰ ◖ <span class="battery"></span></span>
      </div>
      <form class="address top-address">
        <span aria-hidden="true">⌕</span>
        <input class="url" aria-label="Website address" autocomplete="off" spellcheck="false">
        <button type="submit" aria-label="Open address">↵</button>
      </form>
      <div class="bar">
        <form class="address">
          <span aria-hidden="true">ᴀA</span>
          <input class="url" aria-label="Website address" autocomplete="off" spellcheck="false">
          <button type="submit" aria-label="Open address">↵</button>
        </form>
        <div class="tools">
          <span>‹</span><span>›</span><span>□↑</span><span>♧</span><span>▢</span>
        </div>
        <span class="gesture"></span>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const device = document.getElementById('device');

    device.classList.add(params.get('kind'));
    document.body.classList.toggle('desktop-window', params.get('kind') === 'desktop');
    document.body.classList.toggle('native-window-controls', params.get('controlsHeight') === '0');
    document.documentElement.style.setProperty('--controls-height', params.get('controlsHeight') + 'px');
    document.querySelector('.window-title').textContent = params.get('name');
    for (const action of ['close', 'minimize']) {
      document.querySelector(`.window-controls .${action}`).addEventListener('click', () => window.viewports.windowAction(action));
    }
    if (params.get('id') === 'iphone-se') device.classList.add('se');
    device.style.setProperty('--width', params.get('width'));
    device.style.setProperty('--height', params.get('height'));
    device.style.setProperty('--outer-radius', params.get('outerRadius') + 'px');
    device.style.setProperty('--screen-radius', params.get('screenRadius') + 'px');
    device.style.setProperty('--bottom', params.get('bottom') + 'px');
    device.style.setProperty('--status-height', params.get('top') + 'px');

    const inputs = [...document.querySelectorAll('.url')];
    let currentAddress;
    function showAddress(address) {
      currentAddress = address;
      for (const input of inputs) {
        if (input !== document.activeElement) input.value = address;
      }
    }
    showAddress(params.get('url'));
    window.viewports.onAddressChange(address => {
      if (/^https?:/i.test(address)) showAddress(address);
    });
    for (const form of document.querySelectorAll('form.address')) {
      const input = form.querySelector('.url');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const result = await window.viewports.navigate(input.value);
        form.classList.toggle('invalid', !result.ok);
        input.setCustomValidity(result.ok ? '' : result.error);
        if (result.ok) {
          input.blur();
          showAddress(currentAddress || result.url);
        } else {
          input.reportValidity();
        }
      });
      input.addEventListener('blur', () => {
        input.value = currentAddress;
        form.classList.remove('invalid');
        input.setCustomValidity('');
      });
      input.addEventListener('input', () => {
        form.classList.remove('invalid');
        input.setCustomValidity('');
      });
    }
  </script>
</body>
</html>
